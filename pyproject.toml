[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uspto-client"
version = "0.4.0"
description = "A sync-first Python client for USPTO patent, PTAB, and assignment APIs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
]

[project.optional-dependencies]
library = ["ijson>=3.3", "defusedxml>=0.7"]
dev = [
  "ijson>=3.3",
  "defusedxml>=0.7",
  "build>=1",
  "black>=24.0",
  "mypy>=1.8",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-socket>=0.7",
  "python-dotenv>=1.0",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
uspto-library = "uspto_client.library_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uspto_client"]

[tool.hatch.build.targets.wheel.force-include]
"src/uspto_client/data/doc_code_mapping.csv" = "uspto_client/data/doc_code_mapping.csv"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "live: tests that intentionally call the real USPTO API and require --live-uspto",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["uspto_client"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
